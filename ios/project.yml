# XcodeGen project definition — run `xcodegen generate` in this directory,
# then open HandaPH.xcodeproj. See ios/README.md.
name: HandaPH
options:
  bundleIdPrefix: ph.rdy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode for now; migrate to 6 + strict concurrency post-hackathon
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone
    GENERATE_INFOPLIST_FILE: false
targets:
  HandaPH:
    type: application
    platform: iOS
    sources:
      - HandaPH
    scheme:
      testTargets:
        - HandaPHUITests
    info:
      path: HandaPH/Info.plist
      properties:
        CFBundleDisplayName: Handa
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          Handa uses your location to show hazards, hospitals and evacuation
          centres near you, and to personalise flood and storm-surge risk.
          Your location never leaves this phone.
        CFBundleURLTypes:
          - CFBundleURLName: ph.rdy.handa
            CFBundleURLSchemes: [handaph]
  HandaPHUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - HandaPHUITests
    dependencies:
      - target: HandaPH
