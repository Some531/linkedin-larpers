# XcodeGen project definition — run `xcodegen generate` in this directory,
# then open HandaPH.xcodeproj. See ios/README.md.
name: HandaPH
options:
  bundleIdPrefix: ph.rdy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode for now; migrate to 6 + strict concurrency post-hackathon
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"   # iPhone
    GENERATE_INFOPLIST_FILE: false
targets:
  HandaPH:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - HandaPH
    scheme:
      testTargets:
        - HandaPHUITests
    info:
      path: HandaPH/Info.plist
      properties:
        # Capital I in place of the second l — visually identical in a
        # sans-serif face, and "AI" sits inside the name: Phil-AI-ert.
        CFBundleDisplayName: PhilAIert
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          Handa uses your location to show hazards, hospitals and evacuation
          centres near you, and to personalise flood and storm-surge risk.
          Your location never leaves this phone.
        NSMicrophoneUsageDescription: >-
          Handa uses the microphone so you can ask the assistant questions
          by voice instead of typing.
        NSSpeechRecognitionUsageDescription: >-
          Handa converts your voice into text for the assistant. On-device
          recognition is used where available.
        CFBundleURLTypes:
          - CFBundleURLName: ph.rdy.handa
            CFBundleURLSchemes: [handaph]
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
  # Demo build for real-iPhone demos: identical app, but location is
  # hardcoded to Tacloban (DEMO_FIXED_LOCATION) so the risk index and map
  # don't collapse to the phone's real position, and the SMS deep-link URL
  # scheme is not registered. Installs alongside the real app (own bundle id).
  PhilAlert:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: ph.rdy.handa.demo
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEMO_FIXED_LOCATION
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEMO_FIXED_LOCATION
    sources:
      - path: HandaPH
        excludes:
          - Info.plist
    info:
      path: PhilAlert/Info.plist
      properties:
        CFBundleDisplayName: PhilAIert
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          Handa uses your location to show hazards, hospitals and evacuation
          centres near you, and to personalise flood and storm-surge risk.
          Your location never leaves this phone.
        NSMicrophoneUsageDescription: >-
          Handa uses the microphone so you can ask the assistant questions
          by voice instead of typing.
        NSSpeechRecognitionUsageDescription: >-
          Handa converts your voice into text for the assistant. On-device
          recognition is used where available.
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
  HandaPHUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - HandaPHUITests
    dependencies:
      - target: HandaPH
