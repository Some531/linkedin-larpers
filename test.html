<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    nav {
      display: flex;
      justify-content: space-between;
      padding: 20px 50px;
      background: white;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #666;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <nav>
    <h2>MyApp</h2>
    <button onclick="getStarted()">Get Started</button>
  </nav>

  <section class="hero">
    <h1>Welcome to MyApp</h1>
    <p>A simple landing page for our hackathon project.</p>
    <button onclick="getStarted()">Get Started</button>
  </section>

  <script>
    function getStarted() {
      alert("Welcome to MyApp!");
    }
  </script>

</body>
</html>
